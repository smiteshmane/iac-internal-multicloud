name: "Azure Data-Migration-POC Pipeline"

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "environments-project/azure/Data-Migration-POC/**"
      - "modules/azure/**"
      - ".github/workflows/azure-deploy-Data-Migration-POC.yml"
      - ".github/workflows/reusable-terraform-azure-*.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "environments-project/azure/Data-Migration-POC/**"
      - "modules/azure/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Azure Environment (e.g., dev, prod)"
        required: true
        default: "dev"
      project:
        description: "Azure Project Directory Name under environments-project/azure/"
        required: true
        default: "Data-Migration-POC"
      action:
        description: "Terraform Execution Mode"
        required: true
        type: choice
        options:
          - "plan-and-apply"
          - "plan-only"
        default: "plan-and-apply"

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE20: "true"

jobs:
  plan:
    name: "Plan Phase"
    uses: ./.github/workflows/reusable-terraform-azure-plan.yml
    with:
      working_directory: "environments-project/azure/${{ github.event.inputs.project || 'Data-Migration-POC' }}"
      environment_name: "${{ github.event.inputs.environment || 'dev' }}"
      terraform_version: "1.9.5"
      azure_tfvars: ${{ vars.AZURE_TFVARS || '' }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_STORAGE_ACCESS_KEY: ${{ secrets.AZURE_STORAGE_ACCESS_KEY }}
      AZURE_TFVARS: ${{ secrets.AZURE_TFVARS }}
      TF_VAR_default_mi_administrator_login_password: ${{ secrets.TF_VAR_default_mi_administrator_login_password }}
      TF_VAR_default_vm_admin_password: ${{ secrets.TF_VAR_default_vm_admin_password }}

  apply:
    name: "Apply Phase"
    needs: plan
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'plan-only')
    uses: ./.github/workflows/reusable-terraform-azure-apply.yml
    with:
      working_directory: "environments-project/azure/${{ github.event.inputs.project || 'Data-Migration-POC' }}"
      environment_name: "${{ github.event.inputs.environment || 'dev' }}"
      terraform_version: "1.9.5"
      azure_tfvars: ${{ vars.AZURE_TFVARS || '' }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_STORAGE_ACCESS_KEY: ${{ secrets.AZURE_STORAGE_ACCESS_KEY }}
      AZURE_TFVARS: ${{ secrets.AZURE_TFVARS }}
      TF_VAR_default_mi_administrator_login_password: ${{ secrets.TF_VAR_default_mi_administrator_login_password }}
      TF_VAR_default_vm_admin_password: ${{ secrets.TF_VAR_default_vm_admin_password }}
