name: "Reusable Terraform Azure Plan Template"

on:
  workflow_call:
    inputs:
      working_directory:
        required: true
        type: string
        description: "Path to the Azure Terraform project/environment directory"
      environment_name:
        required: true
        type: string
        description: "Target environment name (e.g. dev, staging, prod)"
      terraform_version:
        required: false
        type: string
        default: "1.9.5"
        description: "Terraform CLI version"
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_STORAGE_ACCESS_KEY:
        required: false
      TF_VAR_default_mi_administrator_login_password:
        required: false
      TF_VAR_default_vm_admin_password:
        required: false

jobs:
  terraform-plan:
    name: "Plan (${{ inputs.environment_name }})"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_USE_AZUREAD: "true"
      TF_VAR_default_mi_administrator_login_password: ${{ secrets.TF_VAR_default_mi_administrator_login_password }}
      TF_VAR_default_vm_admin_password: ${{ secrets.TF_VAR_default_vm_admin_password }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Check Azure Credentials
        id: azure-auth-check
        run: |
          if [ -n "$ARM_CLIENT_ID" ] && [ -n "$ARM_CLIENT_SECRET" ] && [ -n "$ARM_TENANT_ID" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "Azure Service Principal credentials detected."
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::Azure credentials are not configured in GitHub Secrets. Running in local validation mode."
          fi

      # Remote backend init when credentials exist
      - name: Terraform Init (Remote Azure Backend)
        if: steps.azure-auth-check.outputs.has_creds == 'true'
        env:
          AZ_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_ACCESS_KEY }}
        run: |
          if [ -n "$AZ_STORAGE_KEY" ]; then
            export ARM_ACCESS_KEY="$AZ_STORAGE_KEY"
          fi
          terraform init

      # Local backend validation when credentials are not configured
      - name: Terraform Init (Validation Mode)
        if: steps.azure-auth-check.outputs.has_creds != 'true'
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      # Static Security Analysis Scan (tfsec)
      - name: Security Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ inputs.working_directory }}
          soft_fail: true

      - name: Terraform Plan
        if: steps.azure-auth-check.outputs.has_creds == 'true'
        env:
          AZ_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_ACCESS_KEY }}
        run: |
          if [ -n "$AZ_STORAGE_KEY" ]; then
            export ARM_ACCESS_KEY="$AZ_STORAGE_KEY"
          fi
          terraform plan -no-color -input=false -out=tfplan > plan.txt 2>&1 || true
          cat plan.txt

      - name: Save Plan Artifact
        if: steps.azure-auth-check.outputs.has_creds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-azure-${{ inputs.environment_name }}
          path: ${{ inputs.working_directory }}/tfplan

      # Post or update Terraform Plan report comment on Pull Request
      - name: Post Terraform Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && steps.azure-auth-check.outputs.has_creds == 'true'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const planFilePath = '${{ inputs.working_directory }}/plan.txt';
            let planText = 'No plan output generated.';
            if (fs.existsSync(planFilePath)) {
              planText = fs.readFileSync(planFilePath, 'utf8');
            }

            if (planText.length > 60000) {
              planText = planText.substring(0, 60000) + '\n... [Plan output truncated due to size limit]';
            }

            const header = `### 📋 Azure Terraform Plan Report (${{ inputs.environment_name }})`;
            const body = `${header}

            **Target Environment:** \`${{ inputs.environment_name }}\`
            **Working Directory:** \`${{ inputs.working_directory }}\`
            **Triggered By:** @${context.actor}

            <details><summary><b>Click to expand Terraform Plan Output</b></summary>

            \`\`\`hcl
            ${planText}
            \`\`\`

            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes(header);
            });

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
